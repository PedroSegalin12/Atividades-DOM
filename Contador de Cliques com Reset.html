<head>
    <title>Contador de cliques</title>
</head>
<body>
    <button onclick="contar()">Contar</button>
    <button onclick="resetar()">Resetar</button>
    <div id="contador">Cliques: 0</div>

    <script>
        let cliques = 0
       
        function contar() {
            cliques++
            document.getElementById("contador").innerHTML="Cliques:" + cliques 
        }
        function resetar() {
            cliques = 0
            document.getElementById("contador").innerHTML= "Cliques: 0"
        }
    </script>
</body>
